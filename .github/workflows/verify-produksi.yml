name: Verifikasi produksi

# Menjalankan audit UI + fungsi terhadap SITUS LIVE (GitHub Pages),
# bukan terhadap server lokal. Runner GitHub dapat menjangkau
# *.github.io, sedangkan sandbox lokal tidak.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "tool-*.js"
      - "tools/**"
      - ".github/workflows/verify-produksi.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pasang Chromium
        run: |
          npx --yes playwright@1.49.1 install --with-deps chromium

      - name: Pasang dependensi
        run: |
          npm install --no-save --no-package-lock playwright-core@1.49.1 pdf-lib@1.17.1

      - name: Siapkan fixture PDF
        env:
          FIXTURES_DIR: ${{ github.workspace }}/fixtures
        run: node tools/mkfixtures.mjs

      - name: Audit UI + fungsi (produksi live)
        env:
          SITE_URL: https://putra1996.github.io/PDF/index.html
          FIXTURES_DIR: ${{ github.workspace }}/fixtures
          HARNESS_DIR: ${{ github.workspace }}
        run: |
          node tools/verify-produksi.mjs "$SITE_URL" | tee /tmp/hasil-audit.txt

      - name: Simpan screenshot produksi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-produksi
          path: /tmp/prod/
          if-no-files-found: warn

      - name: Unggah hasil audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-audit
          path: /tmp/hasil-audit.txt
          if-no-files-found: warn
